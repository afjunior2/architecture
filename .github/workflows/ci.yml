name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch/PR quando um commit novo chega.
# Chaveado por github.ref: pushes em branches diferentes nunca se cancelam entre si.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-tests:
    name: Build, testes unitários, arquitetura e integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FluxoDeCaixa.sln

      # Warning tratado como erro (Directory.Build.props). Se compilar, os avisos
      # já viraram erro aqui - não precisa de outro passo para isso.
      - name: Build (Release, warnings como erro)
        run: dotnet build FluxoDeCaixa.sln -c Release --no-restore -warnaserror

      - name: Testes unitários
        run: dotnet test tests/FluxoDeCaixa.UnitTests/FluxoDeCaixa.UnitTests.csproj -c Release --no-build

      - name: Testes de arquitetura
        run: dotnet test tests/FluxoDeCaixa.ArchitectureTests/FluxoDeCaixa.ArchitectureTests.csproj -c Release --no-build

      # Testcontainers sobe Postgres e RabbitMQ reais por conta própria (ver
      # AmbienteFixture.cs). O runner ubuntu-latest já tem Docker em execução;
      # não há serviço de banco/broker duplicado aqui no workflow.
      - name: "Testes de integração (Testcontainers: PostgreSQL + RabbitMQ)"
        run: dotnet test tests/FluxoDeCaixa.IntegrationTests/FluxoDeCaixa.IntegrationTests.csproj -c Release --no-build

  security:
    name: Dependências com vulnerabilidade conhecida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FluxoDeCaixa.sln

      # dotnet list package --vulnerable sempre sai com exit code 0, mesmo achando
      # CVE (comportamento confirmado manualmente antes de usar isso aqui). O
      # --format json dá uma saída estável, independente do idioma do runner, que o
      # jq abaixo transforma em gate de verdade: falha se qualquer pacote (direto ou
      # transitivo) tiver "vulnerabilities" preenchido.
      #
      # Isso complementa, não repete, o NuGetAudit que já roda no restore/build do
      # job build-and-tests: o modo padrão do NuGetAudit cobre só pacotes de nível
      # superior; --include-transitive aqui cobre o que ele deixa passar.
      - name: Checar pacotes vulneráveis (diretos e transitivos)
        run: |
          dotnet list FluxoDeCaixa.sln package --vulnerable --include-transitive --format json > vulnerable.json
          cat vulnerable.json
          encontrados=$(jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // [])) [] | select(.vulnerabilities != null)] | length' vulnerable.json)
          if [ "$encontrados" -gt 0 ]; then
            echo "::error::Pacote(s) com vulnerabilidade de segurança conhecida encontrado(s)."
            jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // [])) [] | select(.vulnerabilities != null)]' vulnerable.json
            exit 1
          fi
          echo "Nenhum pacote com vulnerabilidade conhecida (direta ou transitiva)."

  docker-build:
    name: Docker build das imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens (Dockerfiles reais do projeto)
        run: docker compose build

  demo-e2e:
    name: Demo E2E (docker compose + scripts/demo.sh)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo
        run: docker compose up -d --wait --build

      - name: Rodar o roteiro de demonstração E2E
        run: ./scripts/demo.sh

      # Só roda se algum passo anterior deste job falhar: dá visibilidade real da
      # causa (containers, logs) sem esconder a falha original nem virar verde.
      - name: Diagnóstico dos containers (só roda se o E2E falhar)
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Encerrar o ambiente
        if: always()
        run: docker compose down -v

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [build-and-tests, security, docker-build, demo-e2e]
    if: always()
    steps:
      - name: Confirmar que todos os gates obrigatórios passaram
        run: |
          if [ "${{ needs['build-and-tests'].result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs['docker-build'].result }}" != "success" ] || \
             [ "${{ needs['demo-e2e'].result }}" != "success" ]; then
            echo "::error::Um ou mais gates obrigatórios não passaram."
            exit 1
          fi
          echo "Todos os gates obrigatórios passaram."
